name: Build Android AAB

on:
  workflow_dispatch:
  # 임시: 빌드 문제 진단 중에만 워크플로 파일 푸시 시 자동 실행 (진단 후 제거)
  push:
    paths:
      - ".github/workflows/build-android.yml"
      - "android/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web (static export)
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Check signing secrets
        shell: bash
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=시크릿 누락::${name} 값이 비어 있습니다. 이름과 값을 다시 확인하세요."
              missing=1
            fi
          done
          exit $missing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build signed AAB
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew bundleRelease --console=plain --stacktrace > "$RUNNER_TEMP/gradle.log" 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            # 실패 원인을 어노테이션으로 요약해 로그를 열지 않고도 확인할 수 있게 한다.
            msg=$(grep -E -A12 "What went wrong" "$RUNNER_TEMP/gradle.log" | head -25 | awk '{printf "%s%%0A", $0}')
            [ -z "$msg" ] && msg=$(tail -25 "$RUNNER_TEMP/gradle.log" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle 빌드 실패::$msg"
            tail -60 "$RUNNER_TEMP/gradle.log"
          fi
          exit $code
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
